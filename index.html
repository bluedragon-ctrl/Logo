<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blue Logo</title>
<link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg">
<script type="module" src="/src/main.ts"></script>
</head>
<body>

<div id="panel">
  <header id="title-row">
    <h1><img class="logo" src="/src/assets/logo.svg" alt=""> BLUE LOGO <span class="version">v%APP_VERSION%</span></h1>
    <button id="opt-btn" class="tb-btn" aria-label="Options" title="Options — speed, font size, canvas, save picture"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button>
  </header>
  <div id="split">
    <!-- Toolbar above the editor: help on the left, editor tools on the right.
         Icons are inline SVG (src/styles/app.css .ic); every icon button has an aria-label. -->
    <div id="code-label" role="toolbar" aria-label="Code tools">
      <span class="tb-group">
        <button id="btn-ref" class="tb-btn tb-wide" title="Commands — every Logo command, with examples (F1)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span>Commands</span></button>
        <button id="btn-examples" class="tb-btn tb-wide" title="Examples — ready-made programs to open and run"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>Examples</span></button>
      </span>
      <span id="code-label-btns">
        <span id="ln-indicator" title="Current line number">L:1</span>
        <span class="tb-group">
          <button id="btn-fmt-code" class="tb-btn" aria-label="Tidy code" title="Tidy code — fix the indentation"><svg class="ic ic-main" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M11 10h9M11 15h9M4 20h16"/><path d="m4 9.5 3 2.5-3 2.5"/></svg><svg class="ic ic-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
          <button id="btn-copy-code" class="tb-btn" aria-label="Copy code" title="Copy the code to the clipboard"><svg class="ic ic-main" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="ic ic-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
        </span>
        <span class="tb-group">
          <button id="btn-load-file" class="tb-btn" aria-label="Open file" title="Open a program from a file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
          <button id="btn-save-file" class="tb-btn" aria-label="Save to file" title="Save the program to a file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></svg></button>
        </span>
      </span>
    </div>
    <div id="code-wrap">
      <div id="editor"></div> <!-- CodeMirror mounts here (src/editor/editor.ts) -->
    </div>
    <div id="splitter"></div>
    <div id="console-label"><button id="btn-console-toggle" class="pane-toggle" aria-expanded="true" title="Show / hide the console"><svg class="ic ic-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="pane-title">Console</span></button></div>
    <div id="console"></div>
    <!-- Direct-mode input (inside #split so flex layout is shared) -->
    <div id="direct-panel">
      <div id="direct-row">
        <span id="direct-prompt">&gt;</span>
        <input id="direct-input" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="none"
               spellcheck="false"
               placeholder="Type a command… (Enter to run)">
        <button id="btn-direct-run">▶</button>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-run">▶ Run</button>
    <button id="btn-stop">■ Stop</button>
    <button id="btn-clear" title="Clear screen, variables, procedures and console">Clear</button>
    <button id="btn-direct-toggle" title="Toggle direct command input mode">Direct</button>
  </div>
</div>

<div id="canvas-panel">
  <canvas id="c"></canvas>

  <div id="opt-overlay">
    <button class="close-btn" id="btn-opt-close">✕</button>
    <h2>Options</h2>

    <div class="opt-section">
      <div class="opt-label">Save</div>
      <button id="save-btn" title="Save canvas as PNG">&#x2913; Save as PNG</button>
    </div>

    <div class="opt-section">
      <div class="opt-label">Font size</div>
      <div class="opt-row">
        <button class="opt-pill active" data-fs="1">Small</button>
        <button class="opt-pill" data-fs="1.25">Medium</button>
        <button class="opt-pill" data-fs="1.5">Large</button>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Console log</div>
      <label class="opt-check"><input type="checkbox" id="log-op"><span>Motion (FD, RT…)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-info"><span>Info (MAKE, calls…)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-ok" checked><span>Status (Done, Stop)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-err" checked><span>Errors</span></label>
    </div>

    <div class="opt-section">
      <div class="opt-label">Behaviour</div>
      <label class="opt-check"><input type="checkbox" id="opt-clear-on-run" checked><span>Clear screen on run</span></label>
      <div class="opt-speed-row">
        <span class="opt-speed-label">Speed</span>
        <span class="opt-speed-end">Slow</span>
        <input type="range" id="opt-speed" min="0" max="4" value="0">
        <span class="opt-speed-end">Fast</span>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Canvas</div>
      <div class="opt-row">
        <button class="opt-pill active" data-canvas="beige">Beige</button>
        <button class="opt-pill" data-canvas="white">White</button>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Turtle</div>
      <div class="opt-row">
        <button class="opt-pill active" data-turtle="turtle">Turtle</button>
        <button class="opt-pill" data-turtle="triangle">Triangle</button>
      </div>
    </div>
  </div>

  <div id="ref-overlay">
    <div id="ref-header">
      <button class="close-btn" id="btn-ref-close">✕</button>
      <h2>Commands</h2>
      <input id="ref-search" class="panel-search" type="search" placeholder="Search commands… (try: turn, colour, loop)" aria-label="Search commands"
             autocomplete="off" spellcheck="false">
      <div class="chips" id="ref-chips" role="group" aria-label="Command groups"></div> <!-- built by ui/reference-panel.ts -->
    </div>
    <div id="ref-body"></div> <!-- built from src/reference.ts by ui/reference-panel.ts -->
  </div>

  <div id="ex-overlay">
    <div id="ex-header">
      <button class="close-btn" id="btn-ex-close">✕</button>
      <h2>Examples</h2>
      <div class="ex-hint">Pick one to see it, then open it in the editor and press Run</div>
      <input id="ex-search" class="panel-search" type="search" placeholder="Search examples… (title, idea or command)" aria-label="Search examples"
             autocomplete="off" spellcheck="false">
      <div class="chips" id="ex-chips" role="group" aria-label="Example topics"></div> <!-- built by ui/examples-overlay.ts -->
      <div id="ex-uses" hidden>Examples that use <b id="ex-uses-word"></b> <button type="button" id="ex-uses-clear" title="Show all examples">✕</button></div>
    </div>
    <div id="ex-grid"></div> <!-- cards built by ui/examples-overlay.ts -->
    <div id="ex-none" class="ref-none" hidden>No example matches.</div>
    <div id="ex-preview" hidden>
      <div class="exp-bar">
        <button type="button" id="ex-back">← All examples</button>
        <button type="button" id="ex-open">Open in editor</button>
      </div>
      <div class="exp-main">
        <canvas id="exp-pic" class="ex-thumb"></canvas>
        <div class="exp-info">
          <div class="ex-title" id="exp-title"></div>
          <div class="ex-desc" id="exp-desc"></div>
          <div class="exp-topic" id="exp-topic"></div>
          <div class="ref-label">Commands used</div>
          <div class="exp-cmds" id="exp-cmds"></div>
        </div>
      </div>
      <pre class="exp-code" id="exp-code"></pre>
    </div>
  </div>
</div>
</body>
</html>
