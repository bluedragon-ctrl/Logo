<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blue Logo</title>
<link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg">
<script type="module" src="/src/main.ts"></script>
</head>
<body>

<div id="panel">
  <h1><img class="logo" src="/src/assets/logo.svg" alt=""> BLUE LOGO <span class="version">v%APP_VERSION%</span></h1>
  <div id="split">
    <div id="code-label"><span>Code</span><span id="code-label-btns"><span id="ln-indicator" title="Current line number">L:1</span><button id="btn-fmt-code" title="Beautify / auto-indent code">≡</button><button id="btn-copy-code" title="Copy code to clipboard">⎘</button><button id="btn-console-toggle" class="active" title="Show / hide console log">Log</button><button id="btn-save-file" title="Save program to file">Save</button><button id="btn-load-file" title="Load program from file">Load</button><button id="opt-btn" title="Options">⚙</button></span></div>
    <div id="code-wrap">
      <div id="editor"></div> <!-- CodeMirror mounts here (src/editor/editor.ts) -->
    </div>
    <div id="splitter"></div>
    <div id="console-label"><span>Console</span></div>
    <div id="console"></div>
    <!-- Direct-mode input (inside #split so flex layout is shared) -->
    <div id="direct-panel">
      <div id="direct-row">
        <span id="direct-prompt">&gt;</span>
        <input id="direct-input" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="none"
               spellcheck="false"
               placeholder="Type a command… (Enter to run)">
        <button id="btn-direct-run">▶</button>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-run">▶ Run</button>
    <button id="btn-stop">■ Stop</button>
    <button id="btn-clear" title="Clear screen, variables, procedures and console">Clear</button>
    <button id="btn-direct-toggle" title="Toggle direct command input mode">Direct</button>
  </div>
  <div class="btn-row">
    <button id="btn-ref">Commands</button>
    <button id="btn-examples">Examples</button>
  </div>
</div>

<div id="canvas-panel">
  <canvas id="c"></canvas>

  <div id="opt-overlay">
    <button class="close-btn" id="btn-opt-close">✕</button>
    <h2>Options</h2>

    <div class="opt-section">
      <div class="opt-label">Save</div>
      <button id="save-btn" title="Save canvas as PNG">&#x2913; Save as PNG</button>
    </div>

    <div class="opt-section">
      <div class="opt-label">Font size</div>
      <div class="opt-row">
        <button class="opt-pill active" data-fs="1">Small</button>
        <button class="opt-pill" data-fs="1.25">Medium</button>
        <button class="opt-pill" data-fs="1.5">Large</button>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Console log</div>
      <label class="opt-check"><input type="checkbox" id="log-op"><span>Motion (FD, RT…)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-info"><span>Info (MAKE, calls…)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-ok" checked><span>Status (Done, Stop)</span></label>
      <label class="opt-check"><input type="checkbox" id="log-err" checked><span>Errors</span></label>
    </div>

    <div class="opt-section">
      <div class="opt-label">Behaviour</div>
      <label class="opt-check"><input type="checkbox" id="opt-clear-on-run" checked><span>Clear screen on run</span></label>
      <div class="opt-speed-row">
        <span class="opt-speed-label">Speed</span>
        <span class="opt-speed-end">Slow</span>
        <input type="range" id="opt-speed" min="0" max="4" value="0">
        <span class="opt-speed-end">Fast</span>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Canvas</div>
      <div class="opt-row">
        <button class="opt-pill active" data-canvas="beige">Beige</button>
        <button class="opt-pill" data-canvas="white">White</button>
      </div>
    </div>

    <div class="opt-section">
      <div class="opt-label">Turtle</div>
      <div class="opt-row">
        <button class="opt-pill active" data-turtle="turtle">Turtle</button>
        <button class="opt-pill" data-turtle="triangle">Triangle</button>
      </div>
    </div>
  </div>

  <div id="ref-overlay">
    <div id="ref-header">
      <button class="close-btn" id="btn-ref-close">✕</button>
      <h2>Commands</h2>
      <input id="ref-search" type="search" placeholder="Search commands…" aria-label="Search commands"
             autocomplete="off" spellcheck="false">
    </div>
    <div id="ref-body"></div> <!-- built from src/reference.ts by ui/reference-panel.ts -->
  </div>

  <div id="ex-overlay">
    <div id="ex-header">
      <button class="close-btn" id="btn-ex-close">✕</button>
      <h2>Examples</h2>
      <div class="ex-hint">Pick one to load it into the editor, then press Run</div>
    </div>
    <div id="ex-grid"></div> <!-- cards built by ui/examples-overlay.ts -->
  </div>
</div>
</body>
</html>
